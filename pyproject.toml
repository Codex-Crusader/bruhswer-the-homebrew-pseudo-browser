# THIS FILE DOES NOT BUILD A PYTHON DISTRIBUTION, AND THAT IS DELIBERATE.
#
# The old `packages = ["app"]` does not recurse, so `pip wheel .` produced a wheel
# with five top-level modules and none of the nine subpackages, including every
# security guard. Fixing discovery would be worse: top_level.txt read `app`, so a
# correct build installs a package named `app` into site-packages.
#
# bruhswer is a Windows GUI application, not a library. It ships as an Inno Setup
# installer or `python bruhswer.py` from a clone. If it ever needs to be importable
# the fix is a `bruhswer.` namespace and a real entry point, not find-packages.

[project]
name = "bruhswer"
version = "0.12.0"
description = "A measured, fail-closed security wrapper around Microsoft Edge on Windows."
requires-python = ">=3.11"
authors = [{ name = "Bhargavaram Krishnapur" }]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["security", "privacy", "browser", "windows", "edge", "hardening"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Private :: Do Not Upload",
]

# EMPTY, AND IT STAYS EMPTY.
#
# bruhswer uses the Python standard library only. That is a security decision, not
# an accident of scope: every package added here is a package the user has to
# trust, and a browser-hardening tool that quietly pulls in a dependency tree has
# given away the argument it is making. CI fails the build if a requirements.txt
# appears, so this cannot drift silently.
dependencies = []

# DEVELOPMENT tooling only. Nothing here is imported by the application, nothing here
# ships, and `dependencies` above stays empty - that is the claim the project makes and
# CI fails the build if a requirements.txt appears.
#
# Ruff is declared because it GATES THE BUILD. It was configured in this file and run in
# CI while being installed nowhere locally, so `tools/lint_report.py` was the linter a
# developer actually ran and ruff was the linter that decided whether the build passed.
# Two releases in a row went out red on ruff findings that a local run would have shown
# in a second. Declaring it makes `pip install -e .[dev]` produce the same verdict CI
# gives.
[project.optional-dependencies]
# PINNED TO THE VERSION CI INSTALLS. It read 0.15.5 while .github/workflows/ci.yml
# installed 0.16.2, so `pip install -e .[dev]` gave a developer a different linter from
# the one gating the build - the same split this comment block was written to close.
dev = ["ruff==0.16.2"]

[project.urls]
Homepage = "https://github.com/Codex-Crusader/bruhswer-the-homebrew-pseudo-browser"
Documentation = "https://github.com/Codex-Crusader/bruhswer-the-homebrew-pseudo-browser/tree/main/docs"
Issues = "https://github.com/Codex-Crusader/bruhswer-the-homebrew-pseudo-browser/issues"
Security = "https://github.com/Codex-Crusader/bruhswer-the-homebrew-pseudo-browser/blob/main/SECURITY.md"

# --- linting ---------------------------------------------------------------------
# Ruff is a DEVELOPMENT tool. It is configured here and run in CI; it is never
# imported by the application and is not a runtime dependency.

[tool.ruff]
line-length = 90
target-version = "py311"
# E501 IS GATED, and is no longer in the ignore list below. It used to be, on the
# grounds that "line length is handled by the formatter" - but no formatter runs in this
# project, so nothing handled it and 71 lines had drifted past 90 columns while ruff
# reported the tree clean.
#
# E1/E2/E3 (indentation, whitespace, blank lines) are still PREVIEW-ONLY in ruff, so
# they are not gated here: turning preview on globally pulls in a pile of unrelated
# preview rules. Check them with
#     ruff check --preview --select E1,E2,E3,W1,W2,W3 .
# which is clean as of this commit.
extend-exclude = [".venv", "tools/stage2", "tools/stage4", "tools/stage25"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "W",      # warnings
    "B",      # bugbear: likely bugs
    "S",      # bandit: security
    "PTH",    # prefer pathlib
    "RUF",    # ruff-specific
]
# Every entry carries its reason. A silent suppression is the same defect class as a
# green light nobody verified.
ignore = [
    "S404",   # importing subprocess is the point; every call site is audited
    "S603",   # subprocess call - every one uses an argv list, never shell=True,
              # and test_security.py enforces both with AST checks
    "S607",   # partial executable path - bruhswer uses absolute paths from
              # config; this fires on test helpers only
    "S105",   # "hardcoded password". Fires on `PASS = "PASS"` in the Verdict enum,
              # which is the project's core vocabulary, not a credential
    "RUF100", # "unused noqa". The E402 markers guard imports that follow a
              # sys.path insert. Ruff happens not to flag those; flake8 does, and
              # stripping the markers to satisfy one linter would break the other
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately contain hostile strings, hardcoded probe values and asserts.
# S324: the WebSocket probe uses SHA-1 because RFC 6455 specifies it. Protocol
# constant, not a choice of hash; nothing is authenticated with it.
"bruhswer/tests/*" = ["S101", "S104", "S105", "S106", "S310", "S324", "B017",
                      "RUF012", "PTH118"]
"bruhswer/tools/*" = ["S101", "S310"]
